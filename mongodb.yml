services:
  mongo:
    image: mongo:${MONGO_VERSION:-8}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g
    ports:
      - '${MONGO_PORT:-27017}:27017'
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-changeme}
      # MONGO_INITDB_DATABASE: ${MONGO_DB:-appdb}
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Web UI (opt-in): docker compose -f mongodb.yml --profile gui up -d
  #   or: GUI=1 make up-mongodb  →  http://localhost:8082
  mongo-express:
    image: mongo-express:${MONGO_EXPRESS_VERSION:-1.0}
    profiles: ['gui']
    restart: unless-stopped
    ports:
      - '${MONGO_EXPRESS_PORT:-8082}:8081'
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USER:-root}:${MONGO_ROOT_PASSWORD:-changeme}@mongo:27017/
      ME_CONFIG_BASICAUTH: 'true'
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:-changeme}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'node -e "const c = require(''http''); const o = { headers: { Authorization: ''Basic '' + Buffer.from(''${MONGO_EXPRESS_USER:-admin}:${MONGO_EXPRESS_PASSWORD:-changeme}'').toString(''base64'') } }; c.get(''http://127.0.0.1:8081/'', o, r => process.exit(r.statusCode === 200 ? 0 : 1)).on(''error'', () => process.exit(1))"']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  mongo-data:
