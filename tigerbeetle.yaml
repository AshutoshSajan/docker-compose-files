# TigerBeetle 3-node local cluster. Requires Linux + `network_mode: host`
# (TigerBeetle validates `--addresses` IPs, so DNS names don't work).
#
# First boot: format the data files once, then start:
#   docker compose -f tigerbeetle.yaml --profile format up
#   docker compose -f tigerbeetle.yaml up -d

services:
  format:
    image: ghcr.io/tigerbeetle/tigerbeetle:${TIGERBEETLE_VERSION:-latest}
    profiles: ['format']
    network_mode: host
    volumes:
      - ./data:/data
    command: 'format --cluster=0 --replica=0 --replica-count=3 /data/0_0.tigerbeetle'

  format-1:
    image: ghcr.io/tigerbeetle/tigerbeetle:${TIGERBEETLE_VERSION:-latest}
    profiles: ['format']
    network_mode: host
    volumes:
      - ./data:/data
    command: 'format --cluster=0 --replica=1 --replica-count=3 /data/0_1.tigerbeetle'

  format-2:
    image: ghcr.io/tigerbeetle/tigerbeetle:${TIGERBEETLE_VERSION:-latest}
    profiles: ['format']
    network_mode: host
    volumes:
      - ./data:/data
    command: 'format --cluster=0 --replica=2 --replica-count=3 /data/0_2.tigerbeetle'

  tigerbeetle_0:
    image: ghcr.io/tigerbeetle/tigerbeetle:${TIGERBEETLE_VERSION:-latest}
    restart: unless-stopped
    command: 'start --addresses=0.0.0.0:3001,0.0.0.0:3002,0.0.0.0:3003 /data/0_0.tigerbeetle'
    network_mode: host
    volumes:
      - ./data:/data

  tigerbeetle_1:
    image: ghcr.io/tigerbeetle/tigerbeetle:${TIGERBEETLE_VERSION:-latest}
    restart: unless-stopped
    command: 'start --addresses=0.0.0.0:3001,0.0.0.0:3002,0.0.0.0:3003 /data/0_1.tigerbeetle'
    network_mode: host
    volumes:
      - ./data:/data

  tigerbeetle_2:
    image: ghcr.io/tigerbeetle/tigerbeetle:${TIGERBEETLE_VERSION:-latest}
    restart: unless-stopped
    command: 'start --addresses=0.0.0.0:3001,0.0.0.0:3002,0.0.0.0:3003 /data/0_2.tigerbeetle'
    network_mode: host
    volumes:
      - ./data:/data
