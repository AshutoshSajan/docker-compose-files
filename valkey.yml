services:
  valkey:
    image: 'valkey/valkey:${VALKEY_VERSION:-8}'
    restart: always
    command: valkey-server --appendonly yes --requirepass ${VALKEY_PASSWORD:-changeme} --rename-command FLUSHDB "" --rename-command FLUSHALL ""
    ports:
      - '${VALKEY_PORT:-6381}:6379'
    volumes:
      - 'valkey_data:/data'
    healthcheck:
      test: ['CMD', 'valkey-cli', '-a', '${VALKEY_PASSWORD:-changeme}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Web UI (opt-in): docker compose -f valkey.yml --profile gui up -d
  #   or: GUI=1 make up-valkey  →  http://localhost:8086
  redis-commander:
    image: rediscommander/redis-commander:${REDIS_COMMANDER_VERSION:-latest}
    profiles: ['gui']
    restart: unless-stopped
    ports:
      - '${VALKEY_COMMANDER_PORT:-8086}:8081'
    environment:
      REDIS_HOSTS: local:valkey:6379:0:${VALKEY_PASSWORD:-changeme}
    depends_on:
      valkey:
        condition: service_healthy

volumes:
  valkey_data:
    driver: local
