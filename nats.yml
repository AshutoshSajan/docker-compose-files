services:
  nats:
    image: nats:${NATS_VERSION:-2}
    restart: unless-stopped
    command: ['--jetstream', '--store_dir', '/data/jetstream', '-m', '8222']
    ports:
      - '${NATS_PORT:-4222}:4222'
      - '${NATS_HTTP_PORT:-8222}:8222'
    volumes:
      - 'nats-data:/data'
    # No healthcheck: the nats image is scratch-based (no shell or HTTP client).
    # Monitoring endpoint (JSON) is built in at :8222 (/connz, /varz, /jsz).

volumes:
  nats-data:
    driver: local
