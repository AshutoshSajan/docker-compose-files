# Minimal working Cassandra for local dev (replaces the old broken file that
# referenced missing build contexts like ./cassandra, ./logspout, ./pickle-*).
# Full observability stack (Reaper/Prometheus/Grafana) is available via profiles.
services:
  cassandra:
    image: cassandra:${CASSANDRA_VERSION:-5.0}
    container_name: cassandra
    restart: unless-stopped
    environment:
      - CASSANDRA_CLUSTER_NAME=${CASSANDRA_CLUSTER:-local-cluster}
      - CASSANDRA_DC=${CASSANDRA_DC:-datacenter1}
      - CASSANDRA_RACK=${CASSANDRA_RACK:-rack1}
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
    ports:
      - '${CASSANDRA_PORT:-9042}:9042'
      # - "7199:7199" # JMX
      # - "7000:7000" # intra-node
      # - "7001:7001" # intra-node SSL
      # - "9160:9160" # thrift
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ['CMD-SHELL', 'nodetool status | grep -q UN']
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s

  cqlsh:
    image: cassandra:${CASSANDRA_VERSION:-5.0}
    profiles: ['tools']
    entrypoint: cqlsh cassandra
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./cassandra-seeds:/seeds:ro

  nodetool:
    image: cassandra:${CASSANDRA_VERSION:-5.0}
    profiles: ['tools']
    entrypoint: ['nodetool', '-h', 'cassandra']
    command: ['status']
    depends_on:
      cassandra:
        condition: service_healthy

  # Optional repair + metrics (modern versions, behind profiles):
  #   docker compose -f cassandra.yml --profile observability up -d
  cassandra-reaper:
    image: thelastpickle/cassandra-reaper:${REAPER_VERSION:-3.6.0}
    profiles: ['observability']
    ports:
      - '8080:8080'
      - '8081:8081'
    depends_on:
      cassandra:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:${PROM_VERSION:-v3.14.0}
    profiles: ['observability']
    ports:
      - '9090:9090'
    volumes:
      - ./cassandra-seeds/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-13.2}
    profiles: ['observability']
    ports:
      - '3000:3000'
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-changeme}
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  cassandra-data:
  prometheus-data:
  grafana-data:
# NOTE: the legacy logspout service mounted /var/run/docker.sock (privileged).
# It was removed. If you need log routing, use an explicit logging driver
# instead of mounting the Docker socket.
