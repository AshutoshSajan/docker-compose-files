services:
  zookeeper:
    image: confluentinc/cp-zookeeper:${CONFLUENT_VERSION:-7.9.9}
    container_name: zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    healthcheck:
      test: ['CMD-SHELL', 'cub zk-ready zookeeper:2181 30']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  broker:
    image: confluentinc/cp-kafka:${CONFLUENT_VERSION:-7.9.9}
    container_name: broker
    restart: unless-stopped
    ports:
      # To learn about configuring Kafka for access across networks see
      # https://www.confluent.io/blog/kafka-client-cannot-connect-to-broker-on-aws-on-docker-etc/
      - '${KAFKA_PORT:-9092}:9092'
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_PORT:-9092},PLAINTEXT_INTERNAL://broker:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    volumes:
      - broker-data:/var/lib/kafka/data
    healthcheck:
      test: ['CMD-SHELL', 'cub kafka-ready -b broker:29092 1 20']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Web UI (opt-in): docker compose -f zookeeper-kafka.yml --profile gui up -d
  #   or: GUI=1 make up-zookeeper-kafka  →  http://localhost:8080
  kafka-ui:
    image: provectuslabs/kafka-ui:${KAFKA_UI_VERSION:-latest}
    profiles: ['gui']
    restart: unless-stopped
    ports:
      - '${KAFKA_UI_PORT:-8080}:8080'
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on:
      broker:
        condition: service_healthy

volumes:
  zookeeper-data:
  zookeeper-logs:
  broker-data:
