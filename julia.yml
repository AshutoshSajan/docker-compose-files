services:
  julia-docker:
    image: julia:${JULIA_VERSION:-1.12}
    working_dir: /work
    stdin_open: true
    tty: true
    ports:
      - '${JULIA_PORT:-7777}:7777'
    volumes:
      - './julia-work:/work'
    # Default to an interactive REPL. Override for scripts, e.g.:
    # command: ["julia", "hello.jl"]
