name: validate

on:
  push:
  pull_request:

jobs:
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate base configs (no profiles)
        run: |
          set -e
          for f in *.yml *.yaml; do
            echo "== $f"
            docker compose -f "$f" config -q
          done

      - name: Validate opt-in gui profiles
        run: |
          set -e
          for s in pgsql postgres-alt mysql mongodb redis redis-master-replica kafka zookeeper-kafka elastic-search; do
            echo "== $s (gui)"
            docker compose --profile gui -f "$s.yml" config -q
          done
          echo "== cassandra (tools/observability/gui)"
          docker compose --profile tools --profile observability --profile gui -f cassandra.yml config -q
          echo "== tigerbeetle (format)"
          docker compose --profile format -f tigerbeetle.yaml config -q

      - name: Validate example env file
        run: docker compose --env-file .env.example -f redis.yml config -q

      - name: Makefile smoke test
        run: |
          set -e
          make help >/dev/null
          make list
          make config-redis >/dev/null
          GUI=1 make config-redis >/dev/null
          make env-ci-test
          ENV=ci-test make config-pgsql >/dev/null
          rm .env.ci-test
          if make up-nope 2>/dev/null; then echo "expected failure for unknown service"; exit 1; fi

  smoke:
    runs-on: ubuntu-latest
    needs: [compose-config]
    steps:
      - uses: actions/checkout@v4

      - name: Boot core stacks and probe them
        run: |
          wait_healthy() {
            file="$1"; svc="$2"; tries="${3:-60}"
            id="$(docker compose -f "$file" ps -q "$svc")"
            for _ in $(seq 1 "$tries"); do
              [ "$(docker inspect "$id" --format '{{.State.Health.Status}}')" = healthy ] && return 0
              sleep 5
            done
            echo "TIMEOUT waiting for $svc ($file) to become healthy"
            docker compose -f "$file" logs --tail=30 "$svc"
            return 1
          }

          # Redis (+ redis-commander GUI profile)
          docker compose --profile gui -f redis.yml up -d
          wait_healthy redis.yml redis 36
          docker compose -f redis.yml exec -T redis redis-cli -a changeme ping | grep -q PONG
          curl -sf -o /dev/null http://localhost:8084/
          docker compose --profile gui -f redis.yml down -v

          # Postgres (+ seed script)
          docker compose -f pgsql.yml up -d
          wait_healthy pgsql.yml postgresql-db 60
          docker compose -f pgsql.yml exec -T postgresql-db psql -U admin -d postgres -tc 'SELECT 1' | grep -q 1
          docker compose -f pgsql.yml exec -T postgresql-db psql -U admin -d postgres -tc 'SELECT COUNT(*) FROM app_health'
          docker compose -f pgsql.yml down -v

          # MySQL
          docker compose -f mysql.yml up -d
          wait_healthy mysql.yml db 90
          docker compose -f mysql.yml exec -T db mysqladmin ping -h localhost -u root -pchangeme-root
          docker compose -f mysql.yml down -v
