services:
  es01:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ES_VERSION:-9.5.3}
    container_name: es01
    restart: unless-stopped
    environment:
      - node.name=es01
      - cluster.name=es-docker-cluster
      - discovery.seed_hosts=es02,es03
      - cluster.initial_master_nodes=es01,es02,es03
      - bootstrap.memory_lock=true
      - 'ES_JAVA_OPTS=-Xms1g -Xmx1g'
      # Security disabled for local dev only. Enable xpack.security for anything shared.
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - data01:/usr/share/elasticsearch/data
    ports:
      - '${ES_PORT:-9200}:9200'
    networks:
      - elastic
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:9200/_cluster/health?wait_for_status=yellow | grep -q .']
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
  es02:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ES_VERSION:-9.5.3}
    container_name: es02
    restart: unless-stopped
    environment:
      - node.name=es02
      - cluster.name=es-docker-cluster
      - discovery.seed_hosts=es01,es03
      - cluster.initial_master_nodes=es01,es02,es03
      - bootstrap.memory_lock=true
      - 'ES_JAVA_OPTS=-Xms1g -Xmx1g'
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - data02:/usr/share/elasticsearch/data
    networks:
      - elastic
  es03:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ES_VERSION:-9.5.3}
    container_name: es03
    restart: unless-stopped
    environment:
      - node.name=es03
      - cluster.name=es-docker-cluster
      - discovery.seed_hosts=es01,es02
      - cluster.initial_master_nodes=es01,es02,es03
      - bootstrap.memory_lock=true
      - 'ES_JAVA_OPTS=-Xms1g -Xmx1g'
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - data03:/usr/share/elasticsearch/data
    networks:
      - elastic

  # Optional: uncomment to add Kibana for local dev.
  # kibana:
  #   image: docker.elastic.co/kibana/kibana:${ES_VERSION:-9.5.3}
  #   ports:
  #     - '${KIBANA_PORT:-5601}:5601'
  #   environment:
  #     - ELASTICSEARCH_HOSTS=http://es01:9200
  #   networks:
  #     - elastic
  #   depends_on:
  #     es01:
  #       condition: service_healthy

volumes:
  data01:
    driver: local
  data02:
    driver: local
  data03:
    driver: local

networks:
  elastic:
    driver: bridge
