# Second Postgres stack on port 5433 (pgsql.yml uses 5432). Pick one.

services:
  postgresql:
    image: postgres:${POSTGRES_VERSION:-18}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
    ports:
      - '${ALT_POSTGRES_PORT:-5433}:5432'
    volumes:
      # Parent mount: required by Postgres 18+, older majors use .../data inside it.
      - 'postgresql-data:/var/lib/postgresql'
    environment:
      - 'POSTGRES_USER=${POSTGRES_USER:-admin}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-admin}'
      - 'POSTGRES_DB=${POSTGRES_DB:-postgres}'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-admin} -d $${POSTGRES_DB:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Web UI (opt-in): docker compose -f postgres-alt.yml --profile gui up -d
  #   or: GUI=1 make up-postgres-alt  →  http://localhost:5050
  pgadmin:
    image: dpage/pgadmin4:${PGADMIN_VERSION:-9}
    profiles: ['gui']
    restart: unless-stopped
    ports:
      - '${PGADMIN_PORT:-5050}:80'
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-changeme}
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'python -c "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen(''http://127.0.0.1:80/login'').status == 200 else 1)"']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  postgresql-data:
    driver: local
  pgadmin-data:
    driver: local
