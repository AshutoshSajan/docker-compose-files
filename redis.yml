services:
  redis:
    # NOTE: bitnami/redis community tags were removed from Docker Hub;
    # this file now uses the official image.
    image: 'redis:7.4'
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-changeme} --rename-command FLUSHDB "" --rename-command FLUSHALL ""
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - 'redis_data:/data'
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-changeme}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  redis_data:
    driver: local
