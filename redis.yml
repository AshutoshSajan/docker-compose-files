services:
  redis:
    image: 'bitnami/redis:7.4'
    restart: always
    environment:
      # Set REDIS_PASSWORD in .env. Empty passwords are refused by default.
      - REDIS_PASSWORD=${REDIS_PASSWORD:-changeme}
      - ALLOW_EMPTY_PASSWORD=${REDIS_ALLOW_EMPTY:-no}
      - REDIS_DISABLE_COMMANDS=FLUSHDB,FLUSHALL
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - 'redis_data:/bitnami/redis/data'
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '$${REDIS_PASSWORD:-changeme}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  redis_data:
    driver: local
