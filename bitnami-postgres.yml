# Alternative Postgres 16 stack (originally Bitnami-based).
# NOTE: bitnami/postgresql community tags were removed from Docker Hub,
# so this file now uses the official postgres:16 image with the same
# service/volume names. Default port 5433 avoids clashing with pgsql.yml.

services:
  postgresql:
    image: postgres:16
    restart: unless-stopped
    ports:
      - '${BITNAMI_POSTGRES_PORT:-5433}:5432'
    volumes:
      - 'postgresql_data:/var/lib/postgresql/data'
    environment:
      - 'POSTGRES_USER=${POSTGRES_USER:-admin}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-admin}'
      - 'POSTGRES_DB=${POSTGRES_DB:-postgres}'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-admin} -d $${POSTGRES_DB:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgresql_data:
    driver: local
