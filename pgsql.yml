services:
  postgresql-db:
    image: postgres:16
    container_name: psql
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    networks:
      - turreta_network
    volumes:
      - db-data:/var/lib/postgresql/data
      # Put *.sql / *.sh files in ./sql_scripts to seed the DB on first start.
      - ./sql_scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-admin} -d $${POSTGRES_DB:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  turreta_network:
    driver: bridge

volumes:
  db-data:
    driver: local
# Usage:
#   docker compose -f pgsql.yml up -d
#   docker exec -it psql bash
#   psql -U admin -d postgres
