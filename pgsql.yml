services:
  postgresql-db:
    image: postgres:${POSTGRES_VERSION:-18}
    container_name: psql
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    networks:
      - pgsql_network
    volumes:
      # NOTE: Postgres 18+ requires the mount at /var/lib/postgresql (parent);
      # older majors then use the .../data subdir automatically.
      - pgsql-data:/var/lib/postgresql
      # Put *.sql / *.sh files in ./sql_scripts to seed the DB on first start.
      - ./sql_scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-admin} -d $${POSTGRES_DB:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Web UI (opt-in): docker compose -f pgsql.yml --profile gui up -d
  #   or: GUI=1 make up-pgsql  →  http://localhost:5050
  pgadmin:
    image: dpage/pgadmin4:${PGADMIN_VERSION:-9}
    profiles: ['gui']
    restart: unless-stopped
    ports:
      - '${PGADMIN_PORT:-5050}:80'
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-changeme}
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - pgsql_network
    depends_on:
      postgresql-db:
        condition: service_healthy

networks:
  pgsql_network:
    driver: bridge

volumes:
  pgsql-data:
    driver: local
  pgadmin-data:
    driver: local
