services:
  rabbitmq:
    # NOTE: bitnami/rabbitmq community tags were removed from Docker Hub;
    # this file now uses the official image (management UI on 15672).
    image: rabbitmq:3.13-management
    restart: unless-stopped
    ports:
      - '${RABBITMQ_AMQP_PORT:-5672}:5672'
      - '${RABBITMQ_MGMT_PORT:-15672}:15672'
      # Clustering / distribution (uncomment if clustering):
      # - '4369:4369'
      # - '25672:25672'
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-user}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-changeme}
      - RABBITMQ_ERLANG_COOKIE=${RABBITMQ_ERL_COOKIE:-changeme-cookie}
    volumes:
      - 'rabbitmq_data:/var/lib/rabbitmq'
    healthcheck:
      test: ['CMD-SHELL', 'rabbitmq-diagnostics -q ping']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  rabbitmq_data:
    driver: local
